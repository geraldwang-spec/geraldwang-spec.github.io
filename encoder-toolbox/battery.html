<!doctype html>
<html lang="zh-Hant">
<head>
<script>(function(){try{var q=new URLSearchParams(location.search),t=q.get("theme");if(t==="dark"||t==="light")document.documentElement.setAttribute("data-theme",t);if(q.get("embed")==="1")document.documentElement.classList.add("embed");}catch(e){}})();</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>電池續航計算</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600&family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="bench.css?v=20261102">
<style>.tbl.tall{max-height:520px;overflow-y:auto} thead th{position:sticky;top:0;background:var(--surface)}</style>
</head>
<body>
<div class="wrap">
  <a class="backlink" href="./#bench">← 回到工具站</a>
  <header>
    <h1>電池續航計算</h1>
    <p class="muted">輸入電池容量、耗電流、滿電和斷電電壓，算出可以用多久，並列出每個電量 % 對應的電壓和剩餘時間。</p>
  </header>

  <div class="top">
    <div class="panel">
      <div class="field"><label for="cap">電池容量</label>
        <div class="row"><input type="number" id="cap" step="10" min="0" value="1000"><span class="unit">mAh</span>
          <button type="button" class="chipbtn" data-cap="500">500</button><button type="button" class="chipbtn" data-cap="1000">1000</button><button type="button" class="chipbtn" data-cap="2000">2000</button><button type="button" class="chipbtn" data-cap="3000">3000</button></div></div>
      <div class="field"><label for="cur">平均耗電流</label>
        <div class="row"><input type="number" id="cur" step="any" min="0" value="50">
          <select id="cu" aria-label="電流單位"><option value="1">mA</option><option value="0.001">µA</option><option value="1000">A</option></select></div></div>
      <div class="field"><label for="vf">滿電電壓（100%）</label>
        <div class="row"><input type="number" id="vf" step="0.01" value="4.2"><span class="unit">V</span></div></div>
      <div class="field"><label for="vc">斷電電壓（0%）</label>
        <div class="row"><input type="number" id="vc" step="0.01" value="3.0"><span class="unit">V</span></div></div>
      <div class="field"><span class="lbl">常用電池</span>
        <div class="row"><button type="button" class="chipbtn" data-bat="4.2,3.0,li">鋰電 4.2 / 3.0</button><button type="button" class="chipbtn" data-bat="4.2,3.3,li">鋰電 4.2 / 3.3</button><button type="button" class="chipbtn" data-bat="3.65,2.5,lin">磷酸鐵鋰 3.65 / 2.5</button><button type="button" class="chipbtn" data-bat="3.0,2.0,lin">2×AA 3.0 / 2.0</button></div></div>
      <div class="field"><label for="eff">可用容量（老化、溫度、轉換效率）</label>
        <div class="row"><input type="number" id="eff" step="1" min="1" max="100" value="100" style="width:6em"><span class="unit">%</span></div></div>
      <div class="field"><span class="lbl">電壓與電量的關係</span>
        <div class="row" id="modeSeg"><button type="button" class="chipbtn" data-mode="lin" aria-pressed="true">線性</button><button type="button" class="chipbtn" data-mode="li" aria-pressed="false">鋰電池放電曲線</button></div>
        <span class="cap" id="modeCap"></span></div>
    </div>

    <div class="panel" aria-live="polite">
      <div class="big"><span class="n" id="hrs">—</span><span class="u">可以用</span></div>
      <div class="formula" id="tf"></div>
      <dl class="kv">
        <dt>換算</dt><dd id="alt"></dd>
        <dt>可用容量</dt><dd id="ucap"></dd>
        <dt>每 1% 電量</dt><dd id="per"></dd>
        <dt>50% 時電壓</dt><dd id="v50"></dd>
      </dl>
      <div class="svgbox"><svg id="plot" viewBox="0 0 600 260" role="img" aria-label="電量百分比與電池電壓的關係圖"></svg></div>
    </div>
  </div>

  <div class="panel">
    <div class="row" style="justify-content:space-between"><h2>每個 % 的電壓與剩餘時間</h2>
      <div class="row"><span class="lbl">間隔</span><div class="row" id="stepSeg"><button type="button" class="chipbtn" data-step="1" aria-pressed="false">1%</button><button type="button" class="chipbtn" data-step="5" aria-pressed="false">5%</button><button type="button" class="chipbtn" data-step="10" aria-pressed="true">10%</button></div>
        <button type="button" class="chipbtn" id="cp">複製表格</button></div></div>
    <div class="tbl tall"><table>
      <thead><tr><th>電量</th><th>電壓 (V)</th><th>剩餘容量 (mAh)</th><th>剩餘時間</th><th>已使用時間</th></tr></thead>
      <tbody id="rows"></tbody>
    </table></div>
    <p class="cap">剩餘時間 = 剩餘容量 ÷ 耗電流。線性模式的電壓 = 斷電電壓 + (滿電 − 斷電) × 電量%。實際電池的電壓會隨負載電流和溫度變動，這裡是估算。</p>
  </div>
</div>

<script src="bench.js?v=20261102"></script>
<script>
/* 典型鋰電池（4.2 V → 3.0 V）靜置電壓曲線，換成 0~1 比例後套用到使用者的滿電 / 斷電電壓 */
const LI=[[0,3.00],[5,3.45],[10,3.68],[20,3.74],[30,3.77],[40,3.79],[50,3.82],[60,3.87],[70,3.92],[80,3.98],[90,4.06],[100,4.20]].map(([p,v])=>[p,(v-3.0)/1.2]);
let mode='lin',step=10,table=[];
function shape(p){
  if(mode==='lin')return p/100;
  for(let i=1;i<LI.length;i++){if(p<=LI[i][0]){const [p0,a]=LI[i-1],[p1,b]=LI[i];return a+(b-a)*(p-p0)/(p1-p0);}}
  return 1;
}
const volt=(p,vf,vc)=>vc+(vf-vc)*shape(p);
function dur(h){
  if(!isFinite(h))return '—';
  if(h<1/60)return fmt(h*3600,1)+' 秒';
  const tm=Math.round(h*60),d=Math.floor(tm/1440),hh=Math.floor(tm%1440/60),mm=tm%60;
  return (d?d+' 天 ':'')+(d||hh?hh+' 小時 ':'')+mm+' 分';
}
function calc(){
  const cap=num('cap'),I=num('cur')*parseFloat($('cu').value),vf=num('vf'),vc=num('vc'),eff=num('eff')/100;
  $('modeCap').textContent=mode==='lin'?'電壓從斷電到滿電平均分配，適合先粗估。':'鋰電池中段電壓很平、頭尾掉得快，比線性更接近實際。';
  if(!(cap>0)||!(I>0)||isNaN(vf)||isNaN(vc)||!(eff>0)){$('hrs').textContent='—';$('rows').innerHTML='';$('plot').innerHTML='';return;}
  const ucap=cap*eff,H=ucap/I;
  $('hrs').textContent=dur(H);
  $('tf').innerHTML=`${fmt(cap)} mAh${eff!==1?` × ${fmt(eff*100)}%`:''} ÷ ${fmt(I,4)} mA = <b class="r">${fmt(H,3)} 小時</b>`;
  $('alt').textContent=`${fmt(H*60,1)} 分鐘 · ${fmt(H/24,2)} 天`;
  $('ucap').textContent=`${fmt(ucap,1)} mAh`;
  $('per').textContent=`${fmt(ucap/100,2)} mAh，約 ${dur(H/100)}`;
  $('v50').textContent=`${fmt(volt(50,vf,vc),3)} V`;
  table=[];for(let p=100;p>=0;p-=step)table.push([p,volt(p,vf,vc),ucap*p/100,H*p/100,H*(100-p)/100]);
  $('rows').innerHTML=table.map(r=>`<tr><td>${r[0]} %</td><td><b class="r">${fmt(r[1],3)}</b></td><td>${fmt(r[2],1)}</td><td>${dur(r[3])}</td><td class="muted">${dur(r[4])}</td></tr>`).join('');
  plot(vf,vc);
}
function plot(vf,vc){
  const L=56,R=580,T=14,B=216,lo=Math.min(vf,vc),hi=Math.max(vf,vc),span=(hi-lo)||1;
  const X=p=>L+(R-L)*p/100,Y=v=>B-(B-T)*(v-lo)/span;
  let h='';
  for(let i=0;i<=4;i++){const v=lo+span*i/4;h+=`<line x1="${L}" x2="${R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${L-8}" y="${Y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="var(--f-mono)">${fmt(v,2)}</text>`;}
  for(let p=0;p<=100;p+=20)h+=`<text x="${X(p)}" y="${B+18}" text-anchor="middle" font-size="11" fill="var(--muted)" font-family="var(--f-mono)">${p}%</text>`;
  let d='';for(let p=0;p<=100;p++)d+=(p?'L':'M')+X(p).toFixed(1)+' '+Y(volt(p,vf,vc)).toFixed(1);
  h+=`<path d="${d}" fill="none" stroke="var(--res)" stroke-width="2.5"/>`;
  h+=`<text x="${(L+R)/2}" y="${B+36}" text-anchor="middle" font-size="12" fill="var(--muted)" font-family="var(--f-body)">電量</text><text x="8" y="${T+4}" font-size="11" fill="var(--muted)" font-family="var(--f-body)">V</text>`;
  $('plot').innerHTML=h;
}
function setMode(m){mode=m;document.querySelectorAll('#modeSeg button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.mode===m));}
document.querySelectorAll('#modeSeg button').forEach(b=>b.addEventListener('click',()=>{setMode(b.dataset.mode);calc();}));
document.querySelectorAll('#stepSeg button').forEach(b=>b.addEventListener('click',()=>{step=+b.dataset.step;document.querySelectorAll('#stepSeg button').forEach(x=>x.setAttribute('aria-pressed',x===b));calc();}));
document.querySelectorAll('[data-cap]').forEach(b=>b.addEventListener('click',()=>{$('cap').value=b.dataset.cap;calc();}));
document.querySelectorAll('[data-bat]').forEach(b=>b.addEventListener('click',()=>{const [f,c,m]=b.dataset.bat.split(',');$('vf').value=f;$('vc').value=c;setMode(m);calc();}));
['cap','cur','vf','vc','eff'].forEach(id=>$(id).addEventListener('input',calc));$('cu').addEventListener('change',calc);
$('cp').addEventListener('click',e=>copyText(['電量%\t電壓V\t剩餘容量mAh\t剩餘時間(小時)\t已使用時間(小時)',...table.map(r=>[r[0],+r[1].toFixed(4),+r[2].toFixed(2),+r[3].toFixed(4),+r[4].toFixed(4)].join('\t'))].join('\n'),e.target));
calc();
</script>
</body>
</html>
