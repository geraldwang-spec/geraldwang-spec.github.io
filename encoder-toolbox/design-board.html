} }

.tcard { border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }

}

.rrow { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.3fr) minmax(0, 1fr) minmax(0, 1fr) 2.2em; gap: 6px; align-items: center; }

.mroot input { flex: 1 1 auto; font-weight: 700; font-size: 15px; background: var(--soft); }
#mind { display: grid; gap: 5px; }
.mrow { display: flex; gap: 6px; align-items: center; min-width: 0; }
.mrow .guide { flex: none; align-self: stretch; border-left: 1px solid var(--line); margin-left: 9px; width: 12px; }
.mrow .dot { flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
.mrow .dot.leaf { background: transparent; border: 1.5px solid var(--accent); box-sizing: border-box; }
.mrow input { flex: 1 1 auto; }

.empty { color: var(--muted); margin: 6px 2px; }
.err { background: var(--err-bg); color: var(--err-ink); font-size: 12.5px; padding: 8px 10px; border-radius: 6px; white-space: pre-wrap; margin: 0; }
#notes { width: 100%; min-height: 110px; resize: vertical; }
details summary { cursor: pointer; font-weight: 500; }
pre.code { font-family: var(--font-code); font-size: 12.5px; background: var(--field); padding: 10px; border-radius: 6px; overflow-x: auto; margin: 8px 0 0; }
.legend { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 3px 12px; font-size: 12.5px; color: var(--muted); margin: 0; }
.legend b { color: var(--ink); font-weight: 500; }

.preview { position: sticky; top: env(safe-area-inset-top, 0px); }
.zoom { display: flex; gap: 6px; align-items: center; }
.zoom button { padding: 3px 9px; font-size: 13px; }
#zoomv { font-variant-numeric: tabular-nums; min-width: 3.5em; text-align: center; color: var(--muted); font-size: 12px; }
#view { overflow: auto; min-height: 360px; max-height: 80vh; border-radius: 6px; background: var(--panel); }
#view svg { display: block; max-width: none; height: auto; }
#view.paper { background: #ffffff; }
#view.pan, #view.pan * { cursor: grab; }
#view.panning, #view.panning * { cursor: grabbing; user-select: none; }
@media (max-width: 960px) { .preview { position: static; } }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.seg[hidden] { display: none; }
.seg button { border: none; border-radius: 0; padding: 3px 10px; font-size: 12.5px; color: var(--muted); background: transparent; }
.seg button[aria-pressed="true"] { background: var(--soft); color: var(--ink); font-weight: 600; }
.tools { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

.backlink { display: inline-block; font-size: 13px; color: var(--muted); text-decoration: none; margin-bottom: 2px; }
.backlink:hover { color: var(--accent); }
</style>

      var y = n.y + oy;
      if (n.depth === 0) {
        out.push('<rect x="' + n.x + '" y="' + (y - BOXH / 2) + '" width="' + n.w + '" height="' + BOXH + '" rx="7" style="fill:var(--root-bg)"/>');
        out.push('<text x="' + (n.x + n.w / 2) + '" y="' + y + '" text-anchor="middle" dominant-baseline="central" style="font:' + fontFor(0).replace(/"/g, "'") + ';fill:var(--root-ink)">' + esc(n.label) + "</text>");
      } else {
        out.push('<text x="' + n.x + '" y="' + y + '" dominant-baseline="central" style="font:' + fontFor(n.depth).replace(/"/g, "'") + ";fill:var(" + (n.empty ? "--faint" : "--ink") + ')">' + esc(n.label) + "</text>");
      }
    });
    out.push("</svg>");
    return out.join("");
  }

  // ---- rendering ----
  var seq = 0, timer = null, zoom = null;
  var view = $("view"), errBox = $("err");
  function isDark() {
    var t = document.documentElement.getAttribute("data-theme");
    if (t) return t === "dark";
    return !!(window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches);
  }
  function initMermaid() {
    if (!window.mermaid) return false;
    var dark = isDark() && tab !== "er"; // ER 圖固定白底黑字
    // "base" theme + our own tokens: calmer colors than the default blue/yellow, in both themes
    mermaid.initialize({ startOnLoad: false, securityLevel: "strict", theme: "base",
      themeVariables: dark
        ? { darkMode: true, background: "#191e27", primaryColor: "#2a3657", primaryTextColor: "#e5e8ee", primaryBorderColor: "#8aa5f2", lineColor: "#9aa3b3", secondaryColor: "#23324a", tertiaryColor: "#1f2633" }
        : { background: "#ffffff", primaryColor: "#dfe7fb", primaryTextColor: "#000000", textColor: "#000000", nodeTextColor: "#000000", primaryBorderColor: "#2f55b5", lineColor: "#333333", secondaryColor: "#eef2fb", tertiaryColor: "#f6f8fc", attributeBackgroundColorOdd: "#ffffff", attributeBackgroundColorEven: "#f3f6fc", edgeLabelBackground: "#ffffff" },
      er: { useMaxWidth: false }, mindmap: { useMaxWidth: false },
      fontFamily: "Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif" });
    return true;
  }
  function applyZoom() {
    var svg = view.querySelector("svg"); if (!svg) return;
    var vb = svg.viewBox && svg.viewBox.baseVal;
    var w = vb && vb.width ? vb.width : svg.getBoundingClientRect().width;
    var z = zoom === null ? Math.min(1.4, Math.max(0.2, (view.clientWidth - 16) / w)) : zoom;
    svg.style.width = Math.round(w * z) + "px";
    $("zoomv").textContent = zoom === null ? "符合" : Math.round(zoom * 100) + "%";
  }
  function currentScale() {
    var svg = view.querySelector("svg");
    if (!svg || !svg.viewBox.baseVal.width) return 1;
    return svg.getBoundingClientRect().width / svg.viewBox.baseVal.width;
  }
  var lastTab = null;
  async function render() {
    var g = tab === "er" ? genER() : genMind(), my = ++seq, thisTab = tab;
    view.classList.toggle("paper", thisTab === "er");
    $("mm").textContent = g.text;
    errBox.textContent = g.problems.length ? "還不能畫進圖裡的部分：\n• " + g.problems.join("\n• ") : "";
    errBox.hidden = !g.problems.length;
    if (!window.mermaid) { view.innerHTML = '<p class="empty">圖表元件載入失敗，請重新整理頁面。</p>'; return; }
    if (g.empty) { view.innerHTML = ""; view.appendChild(el("p", { "class": "empty", text: g.emptyMsg })); lastTab = thisTab; return; }
    if (thisTab === "mind" && mstyle === "tree") {
      view.innerHTML = treeSvg(); lastTab = thisTab; applyZoom(); return;
    }
    initMermaid();
    var id = "dg" + my;
    try {
      var out = await mermaid.render(id, g.text);
      if (my !== seq) return;
      view.innerHTML = out.svg;
      lastTab = thisTab;
      applyZoom();
    } catch (e) {
      if (my !== seq) return;
      if (lastTab !== thisTab) view.innerHTML = "";
      errBox.hidden = false;
      errBox.textContent = (errBox.textContent ? errBox.textContent + "\n\n" : "") + "圖產生失敗（保留上一張圖）：\n" + String((e && e.message) || e).split("\n").slice(0, 4).join("\n");
    } finally {
      ["d" + id, id].forEach(function (x) { var n = document.getElementById(x); if (n && !view.contains(n)) n.remove(); });
    }
  }
  function scheduleRender(ms) { clearTimeout(timer); timer = setTimeout(render, ms == null ? 300 : ms); }

  $("zin").onclick = function () { zoom = Math.min(3, (zoom === null ? currentScale() : zoom) * 1.2); applyZoom(); };
  $("zout").onclick = function () { zoom = Math.max(0.2, (zoom === null ? currentScale() : zoom) / 1.2); applyZoom(); };
  $("zfit").onclick = function () { zoom = null; applyZoom(); };
  window.addEventListener("resize", function () { if (zoom === null) applyZoom(); });
  // ---- 滾輪縮放：以滑鼠所在位置為中心；觸控板雙指捏合（ctrlKey）也走這裡 ----
  view.addEventListener("wheel", function (e) {
    var svg = view.querySelector("svg"); if (!svg) return;
    e.preventDefault(); // 不讓預覽區或整頁捲動，也擋掉瀏覽器自己的 Ctrl+滾輪縮放
    var dy = e.deltaY * (e.deltaMode === 1 ? 16 : e.deltaMode === 2 ? view.clientHeight : 1);
    var old = zoom === null ? currentScale() : zoom;
    var nz = Math.min(3, Math.max(0.2, old * Math.exp(-dy * (e.ctrlKey ? 0.01 : 0.0015))));
    if (Math.abs(nz - old) < 1e-4) return;
    var vr = view.getBoundingClientRect(), sr = svg.getBoundingClientRect();
    var px = (e.clientX - sr.left) / old, py = (e.clientY - sr.top) / old; // 滑鼠下的點（未縮放座標）
    var ox = e.clientX - vr.left, oy = e.clientY - vr.top;
    zoom = nz; applyZoom();
    var sr2 = svg.getBoundingClientRect();
    view.scrollLeft = sr2.left - vr.left + view.scrollLeft + px * nz - ox; // 縮放後讓同一點留在滑鼠下
    view.scrollTop = sr2.top - vr.top + view.scrollTop + py * nz - oy;
  }, { passive: false });
  function onThemeChange() { if (initMermaid()) scheduleRender(0); }
  try { matchMedia("(prefers-color-scheme: dark)").addEventListener("change", onThemeChange); } catch (e) {}
  new MutationObserver(onThemeChange).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });

  $("copy").addEventListener("click", function () {
    var txt = $("mm").textContent, btn = $("copy");
    try {
      navigator.clipboard.writeText(txt).then(function () { btn.textContent = "已複製"; setTimeout(function () { btn.textContent = "複製"; }, 1500); },
        function () { selectMm(); });
    } catch (e) { selectMm(); }
  });
  function selectMm() { var r = document.createRange(); r.selectNodeContents($("mm")); var s = getSelection(); s.removeAllRanges(); s.addRange(r); $("copy").textContent = "已選取，請按 Ctrl+C"; }

  // ---- saving: regenerate the whole page from state and publish it ----
  function updateStatus() {
    var s = $("status"), btn = $("save");
    if (readOnly) { s.className = "chip ro"; s.textContent = "唯讀，無法儲存"; btn.disabled = true; return; }
    if (saving) { s.className = "chip"; s.textContent = "儲存中…"; btn.disabled = true; return; }
    if (isDirty()) { s.className = "chip dirty"; s.textContent = "有未儲存的修改"; }
    else { s.className = "chip ok"; s.textContent = "已儲存"; }
    btn.disabled = !isDirty();
  }
  function buildHtml(state) {
    var json = JSON.stringify(state).replace(/</g, "\\u003c");
    return "<!doctype html><html><head><meta charset=utf8><meta name=viewport content=\"width=device-width,initial-scale=1,viewport-fit=cover\"><style>" + RESET + "</style></head><body>"
      + "<title>" + TITLE + "</title>\n<meta name=\"claude:viewport-fit-sides\" content=\"cover\">\n"
      + "<link rel=\"stylesheet\" href=\"" + FONTS + "\">\n"
      + "<style id=\"page-css\">" + $("page-css").textContent + "</style>\n"
      + "<script type=\"application/json\" id=\"er-data\">" + json + "<\/script>\n"
      + "<template id=\"tpl\">" + tpl.innerHTML + "</template>\n"
      + "<div id=\"app\"></div>\n"
      + "<script src=\"" + MERMAID + "\"><\/script>\n"
      + "<script id=\"app-js\">" + $("app-js").textContent + "<\/script>\n"
      + "</body></html>";
  }
  async function save() {
    if (readOnly || saving || !isDirty()) return;
    saving = true; updateStatus(); writeDraft();
    var next = norm(st); next.savedAt = new Date().toISOString();
    try { localStorage.setItem(LKEY, JSON.stringify(next)); } catch (e) {
      saving = false; updateStatus(); $("status").textContent = "瀏覽器不允許儲存，請用「匯出」備份"; return;
    }
    clearDraft(); saved = clone(next); savedAt = next.savedAt; saving = false; updateStatus(); return;
    try {
      await art.publish(buildHtml(next));
      clearDraft();
      saved = clone(next); savedAt = next.savedAt; saving = false; updateStatus();
    } catch (e) {
      saving = false;
      var code = e && e.code, s = $("status");
      if (["not_writer", "not_granted", "consent_required", "capability_disabled", "not_declared", "capability_removed"].indexOf(code) >= 0) { readOnly = true; updateStatus(); }
      else if (code === "conflict") { s.className = "chip dirty"; s.textContent = "有較新的版本，重新載入中（草稿已保留）"; }
      else if (code === "rate_limited") { updateStatus(); s.textContent = "儲存太頻繁，稍等一下再按"; }
      else { updateStatus(); s.textContent = "儲存失敗，再按一次儲存"; }
    }
  }
  $("save").addEventListener("click", save);
  document.addEventListener("keydown", function (e) {
    if ((e.ctrlKey || e.metaKey) && (e.key === "s" || e.key === "S")) { e.preventDefault(); save(); }
  });

  // ---- 按住空白鍵 + 左鍵拖曳：平移預覽（只在滑鼠停在預覽區上時接管空白鍵） ----
  var overView = false, spaceDown = false, dragging = null;
  function panCursor() { view.classList.toggle("pan", spaceDown); view.classList.toggle("panning", !!dragging); }
  function stopPan() { spaceDown = false; dragging = null; panCursor(); }
  function typing(t) { return t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.tagName === "SELECT" || t.isContentEditable); }
  view.addEventListener("mouseenter", function () { overView = true; });
  view.addEventListener("mouseleave", function () { overView = false; if (!dragging) stopPan(); });
  document.addEventListener("keydown", function (e) {
    if (e.code !== "Space" || (!overView && !dragging) || typing(e.target)) return;
    e.preventDefault(); // 不讓空白鍵捲動整頁或按到按鈕
    if (!spaceDown) { spaceDown = true; panCursor(); }
  });
  document.addEventListener("keyup", function (e) { if (e.code === "Space") stopPan(); });
  window.addEventListener("blur", stopPan);
  view.addEventListener("mousedown", function (e) {
    if (!spaceDown || e.button !== 0) return;
    e.preventDefault();
    dragging = { x: e.clientX, y: e.clientY, sl: view.scrollLeft, st: view.scrollTop };
    panCursor();
  });
  window.addEventListener("mousemove", function (e) {
    if (!dragging) return;
    view.scrollLeft = dragging.sl - (e.clientX - dragging.x); // 圖跟著滑鼠走
    view.scrollTop = dragging.st - (e.clientY - dragging.y);
  });
  window.addEventListener("mouseup", function () { if (dragging) { dragging = null; panCursor(); } });

  // ---- 下載目前的預覽圖：PNG / SVG / Mermaid(.md) ----
  var dl = null;
  function dlMsg(t) { $("dlmsg").textContent = t; $("dlmsg").hidden = !t; }
  function exportSvg() {
    var svg = view.querySelector("svg"); if (!svg) return null;
    var vb = svg.viewBox.baseVal, w = Math.ceil(vb.width), h = Math.ceil(vb.height);
    var c = svg.cloneNode(true);
    c.setAttribute("xmlns", "http://www.w3.org/2000/svg");
    c.setAttribute("width", w); c.setAttribute("height", h);
    c.removeAttribute("style");
    // 補上背景（Mermaid 的圖本身是透明的），顏色跟畫面上一樣
    var bg = document.createElementNS("http://www.w3.org/2000/svg", "rect");
    bg.setAttribute("x", vb.x); bg.setAttribute("y", vb.y); bg.setAttribute("width", vb.width); bg.setAttribute("height", vb.height);
    bg.setAttribute("fill", getComputedStyle(view).backgroundColor);
    c.insertBefore(bg, c.firstChild);
    var txt = new XMLSerializer().serializeToString(c);
    // CSS 變數離開這個頁面就沒有定義，換成實際顏色
    var cs = getComputedStyle(document.documentElement);
    txt = txt.replace(/var\((--[\w-]+)\)/g, function (_, name) { return cs.getPropertyValue(name).trim() || "#000000"; });
    return { text: '<?xml version="1.0" encoding="UTF-8"?>\n' + txt, w: w, h: h };
  }
  function svgToPng(svgText, w, h) {
    return new Promise(function (resolve, reject) {
      var img = new Image(), scale = 2; // 2 倍解析度，放大看也清楚
      img.onload = function () {
        var cv = document.createElement("canvas");
        cv.width = w * scale; cv.height = h * scale;
        var cx = cv.getContext("2d"); cx.scale(scale, scale); cx.drawImage(img, 0, 0, w, h);
        try { cv.toBlob(function (b) { b ? resolve(b) : reject(new Error("toBlob")); }, "image/png"); } catch (e) { reject(e); }
      };
      img.onerror = function () { reject(new Error("load")); };
      img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svgText);
    });
  }
  function stamp() { var d = new Date(), z = function (n) { return (n < 10 ? "0" : "") + n; }; return d.getFullYear() + z(d.getMonth() + 1) + z(d.getDate()) + "-" + z(d.getHours()) + z(d.getMinutes()); }
  async function download(fmt) {
    if (!dl) return;
    var base = (tab === "er" ? "er-diagram" : "mindmap") + "-" + stamp(), file, data;
    try {
      if (fmt === "md") {
        file = base + ".md";
        data = "```mermaid\n" + $("mm").textContent + "```\n";
      } else {
        var ex = exportSvg();
        if (!ex) { dlMsg("目前沒有圖可以下載。"); return; }
        if (fmt === "svg") { file = base + ".svg"; data = ex.text; }
        else { file = base + ".png"; data = await svgToPng(ex.text, ex.w, ex.h); }
      }
      await dl.save({ filename: file, data: data });
      dlMsg("已下載 " + file);
    } catch (e) {
      var code = e && e.code;
      if (code === "declined") dlMsg("");
      else if (code === "rate_limited") dlMsg("下載視窗還開著，處理完再按一次。");
      else if (["unavailable", "not_granted", "capability_disabled", "capability_removed"].indexOf(code) >= 0) { $("dl").hidden = true; dlMsg("這個檢視不能下載檔案。"); }
      else if (fmt === "png") dlMsg("PNG 產生失敗，請改用 SVG。");
      else dlMsg("下載失敗，請再試一次。");
    }
  }
  Array.prototype.forEach.call($("dl").querySelectorAll("button"), function (b) { b.addEventListener("click", function () { download(b.getAttribute("data-f")); }); });

  // ---- start ----
  initMermaid();
  renderTables(); renderRels(); renderMind(); $("notes").value = st.notes; updateStatus();
  setTab(tab);
  setStyle(mstyle);
  // 獨立版：瀏覽器原生下載
  function saveFile(name, data) {
    var blob = data instanceof Blob ? data : new Blob([data], { type: "text/plain;charset=utf-8" });
    var a = document.createElement("a"), url = URL.createObjectURL(blob);
    a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
    return Promise.resolve();
  }
  dl = { save: function (o) { return saveFile(o.filename, o.data); } };
  $("dl").hidden = false;
  $("export").addEventListener("click", function () {
    saveFile("design-board-" + stamp() + ".json", JSON.stringify(norm(st), null, 2));
  });
  $("import").addEventListener("click", function () { $("import-file").click(); });
  $("import-file").addEventListener("change", function () {
    var f = this.files && this.files[0]; this.value = ""; if (!f) return;
    f.text().then(function (txt) {
      var o = JSON.parse(txt);
      if (!o || !Array.isArray(o.tables) || !Array.isArray(o.rels)) throw new Error("format");
      st = clone(o); changed(); renderAll();
      showBanner("已匯入「" + f.name + "」，還沒儲存。", "好", function () {}, "復原", function () { st = clone(saved); clearDraft(); renderAll(); });
    }).catch(function () { showBanner("這個檔案不是設計草稿板匯出的 JSON。", "好", function () {}, "關閉", function () {}); });
  });
  $("new").addEventListener("click", function () {
    var before = clone(st);
    st = clone({}); changed(); renderAll();
    showBanner("已清空成空白草稿，還沒儲存。", "好", function () {}, "復原", function () { st = before; changed(); renderAll(); });
  });
  updateStatus();
})();
</script>
</body>
</html>
